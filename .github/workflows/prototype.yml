# Builds a visitor's app from the website's app builder, as a working prototype.
#
# The site (web/src/app/api/prototype) starts this with the visitor's answers. It makes the app
# with fohm-scaffold's `new` (no AI), writes its content in with one small Claude call (or from the
# answers alone, without ANTHROPIC_API_KEY), and deploys it to the Vercel project in
# VERCEL_PROJECT_ID, where it runs in demo mode with no database, at https://fohm-<id>.vercel.app.
# The site finds the run by its name and the app by that address, so nothing is stored.
#
# Secrets: VERCEL_TOKEN, ANTHROPIC_API_KEY (optional). Variables: VERCEL_ORG_ID, VERCEL_PROJECT_ID,
# SCAFFOLD_REF (the scaffold's branch; the latest work until it merges), PROTOTYPE_MODEL (optional).
name: Build a prototype
run-name: prototype ${{ inputs.id }}

on:
  workflow_dispatch:
    inputs:
      id:
        description: The prototype's id (8 to 16 lower-case letters and digits)
        required: true
        type: string
      answers:
        description: The answers, as base64 JSON
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - name: Check the id
        env:
          ID: ${{ inputs.id }}
        run: '[[ "$ID" =~ ^[a-z0-9]{8,16}$ ]] || { echo "Bad id"; exit 1; }'

      - name: Fetch the scaffold
        env:
          SCAFFOLD_REF: ${{ vars.SCAFFOLD_REF || 'claude/tender-allen-ejoycv' }}
        run: git clone --depth 1 --branch "$SCAFFOLD_REF" https://github.com/rhoneybul/fohm-scaffold.git "$RUNNER_TEMP/scaffold"

      - run: npm ci --prefix prototype

      - name: Make the app
        working-directory: prototype
        env:
          ID: ${{ inputs.id }}
          ANSWERS: ${{ inputs.answers }}
          SCAFFOLD_DIR: ${{ runner.temp }}/scaffold
          OUT_DIR: ${{ runner.temp }}/app
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROTOTYPE_MODEL: ${{ vars.PROTOTYPE_MODEL }}
        run: npx tsx build.ts

      - name: Deploy it to Vercel, in demo mode
        env:
          ID: ${{ inputs.id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        working-directory: ${{ runner.temp }}/app
        run: |
          url=$(npx --yes vercel@65.12.1 deploy --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --meta prototype="$ID")
          echo "Deployed: $url"
          npx --yes vercel@65.12.1 alias set "$url" "fohm-$ID.vercel.app" --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
          echo "::notice title=Prototype::https://fohm-$ID.vercel.app"
